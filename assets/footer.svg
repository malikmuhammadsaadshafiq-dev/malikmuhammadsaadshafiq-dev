<svg xmlns="http://www.w3.org/2000/svg" width="800" height="96" fill="none">
  <foreignObject width="100%" height="100%">
    <div xmlns="http://www.w3.org/1999/xhtml">
      <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        @keyframes blink { 0%,100% { opacity: 1; } 50% { opacity: 0.3; } }
        @keyframes caret { 0%,49% { opacity: 1; } 50%,100% { opacity: 0; } }
        @keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
        .panel {
          position: relative; width: 800px; height: 96px;
          background: radial-gradient(120% 160% at 50% 120%, #0d1b25 0%, #0a0f15 60%);
          border: 1px solid rgba(64,200,200,0.16); border-radius: 10px; overflow: hidden;
          display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 7px;
          font-family: ui-monospace, 'Cascadia Mono', 'JetBrains Mono', 'SF Mono', Consolas, monospace;
        }
        .corner { position: absolute; width: 11px; height: 11px; border: 1.5px solid rgba(63,224,208,0.5); }
        .c-tl { top: 6px; left: 6px; border-right: 0; border-bottom: 0; } .c-tr { top: 6px; right: 6px; border-left: 0; border-bottom: 0; }
        .c-bl { bottom: 6px; left: 6px; border-right: 0; border-top: 0; } .c-br { bottom: 6px; right: 6px; border-left: 0; border-top: 0; }
        .eyebrow { font-size: 8.5px; font-weight: 700; letter-spacing: 3px; color: #5f8294; display: flex; align-items: center; gap: 8px; animation: rise 0.6s ease; }
        .eyebrow .ld { width: 5px; height: 5px; border-radius: 50%; background: #36e08a; box-shadow: 0 0 6px rgba(54,224,138,0.7); animation: blink 1.7s ease infinite; }
        .line { font-size: 16px; font-weight: 700; letter-spacing: 0.5px; color: #cfe0ea; animation: rise 0.6s ease 0.1s both; }
        .line .cy { color: #3fe0d0; }
        .line .caret { color: #3fe0d0; animation: caret 1.1s step-end infinite; }
        .sub { font-size: 9px; letter-spacing: 1.5px; color: #56697a; animation: rise 0.6s ease 0.2s both; }
      </style>
      <div class="panel">
        <span class="corner c-tl"></span><span class="corner c-tr"></span><span class="corner c-bl"></span><span class="corner c-br"></span>
        <div class="eyebrow"><span class="ld"></span>SYS.&#8734; <span style="color:#3fe0d0">//</span> END OF TRANSMISSION</div>
        <div class="line">$ ship --count <span class="cy">100</span> --before <span class="cy">lunch</span><span class="caret">_</span></div>
        <div class="sub">AI WRITES THE CODE &#183; TASTE DECIDES WHAT GETS BUILT &#183; THE PIPELINE NEVER SLEEPS</div>
      </div>
    </div>
  </foreignObject>
</svg>
