<svg xmlns="http://www.w3.org/2000/svg" width="800" height="184" fill="none">
  <foreignObject width="100%" height="100%">
    <div xmlns="http://www.w3.org/1999/xhtml">
      <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes flow { 0% { left: 0%; opacity: 0; } 12% { opacity: 1; } 88% { opacity: 1; } 100% { left: 100%; opacity: 0; } }
        @keyframes ship { 0%,100% { box-shadow: 0 0 6px rgba(54,224,138,0.2); border-color: rgba(54,224,138,0.45); } 50% { box-shadow: 0 0 16px rgba(54,224,138,0.4); border-color: rgba(54,224,138,0.8); } }
        @keyframes blink { 0%,100% { opacity: 1; } 50% { opacity: 0.3; } }
        .panel {
          position: relative; width: 800px; height: 184px;
          background: linear-gradient(180deg, #0e141d, #0b1017);
          border: 1px solid rgba(64,200,200,0.16); border-radius: 10px; overflow: hidden;
          font-family: ui-monospace, 'Cascadia Mono', 'JetBrains Mono', 'SF Mono', Consolas, 'Liberation Mono', monospace;
          padding: 13px 18px;
        }
        .corner { position: absolute; width: 11px; height: 11px; border: 1.5px solid rgba(63,224,208,0.5); }
        .c-tl { top: 6px; left: 6px; border-right: 0; border-bottom: 0; } .c-tr { top: 6px; right: 6px; border-left: 0; border-bottom: 0; }
        .c-bl { bottom: 6px; left: 6px; border-right: 0; border-top: 0; } .c-br { bottom: 6px; right: 6px; border-left: 0; border-top: 0; }
        .eyebrow { display: flex; justify-content: space-between; align-items: center; font-size: 9px; font-weight: 700; letter-spacing: 2.5px; color: #5f8294; margin-bottom: 12px; }
        .eyebrow b { color: #3fe0d0; }
        .lane { display: flex; align-items: center; }
        .lane-lbl { width: 78px; flex-shrink: 0; text-align: right; padding-right: 12px; }
        .lane-lbl .t { font-size: 9px; font-weight: 700; letter-spacing: 1.5px; color: #8aa0b0; }
        .lane-lbl .s { font-size: 7.5px; letter-spacing: 1px; color: #56697a; display: block; margin-top: 2px; }
        .node { flex: 1; padding: 9px 6px; border: 1px solid rgba(64,200,200,0.18); border-radius: 8px; background: rgba(63,224,208,0.03); text-align: center; animation: rise 0.5s ease both; }
        .lane-1 .node:nth-child(2){animation-delay:0s} .lane-1 .node:nth-child(4){animation-delay:.1s} .lane-1 .node:nth-child(6){animation-delay:.2s}
        .lane-2 .node:nth-child(2){animation-delay:.25s} .lane-2 .node:nth-child(4){animation-delay:.35s} .lane-2 .node:nth-child(6){animation-delay:.45s}
        .ship { animation: rise 0.5s ease 0.55s both, ship 2.4s ease-in-out infinite; border-color: rgba(54,224,138,0.45); }
        .n-name { font-size: 12px; font-weight: 700; color: #cfe0ea; letter-spacing: 0.5px; }
        .n-name.cy { color: #3fe0d0; } .n-name.g { color: #36e08a; }
        .n-sub { font-size: 8px; color: #56697a; margin-top: 2px; letter-spacing: 0.5px; }
        .arr { width: 30px; height: 24px; display: flex; align-items: center; flex-shrink: 0; position: relative; overflow: hidden; }
        .arr-l { width: 100%; height: 1.5px; background: rgba(64,200,200,0.25); position: relative; }
        .arr-d { position: absolute; width: 5px; height: 5px; border-radius: 50%; top: -1.75px; background: #3fe0d0; box-shadow: 0 0 6px rgba(63,224,208,0.8); animation: flow 2s ease-in-out infinite; }
        .arr-h { position: absolute; right: -1px; width: 0; height: 0; border-top: 4px solid transparent; border-bottom: 4px solid transparent; border-left: 5px solid rgba(64,200,200,0.3); }
        .sep { display: flex; align-items: center; gap: 10px; padding: 0 78px; margin: 9px 0; }
        .sep-l { flex: 1; height: 1px; background: rgba(64,200,200,0.12); }
        .sep-t { font-size: 7.5px; color: #5f8294; font-weight: 600; letter-spacing: 1.5px; white-space: nowrap; }
      </style>
      <div class="panel">
        <span class="corner c-tl"></span><span class="corner c-tr"></span><span class="corner c-bl"></span><span class="corner c-br"></span>
        <div class="eyebrow"><span>SYS.03 <b>//</b> SIGNAL FLOW</span><span style="color:#3fe0d0;">DATA &#8594; PRODUCT</span></div>
        <div class="lane lane-1">
          <div class="lane-lbl"><span class="t">INTAKE</span><span class="s">continuous</span></div>
          <div class="node"><div class="n-name cy">RESEARCH</div><div class="n-sub">4 SOURCES</div></div>
          <div class="arr"><div class="arr-l"><div class="arr-d"></div><div class="arr-h"></div></div></div>
          <div class="node"><div class="n-name cy">VERIFY</div><div class="n-sub">MULTI-DIM SCORE</div></div>
          <div class="arr"><div class="arr-l"><div class="arr-d" style="animation-delay:.6s"></div><div class="arr-h"></div></div></div>
          <div class="node"><div class="n-name cy">QUEUE</div><div class="n-sub">APPROVED IDEAS</div></div>
        </div>
        <div class="sep"><div class="sep-l"></div><div class="sep-t">ONE PRODUCT BUILT END-TO-END AT A TIME</div><div class="sep-l"></div></div>
        <div class="lane lane-2">
          <div class="lane-lbl"><span class="t">BUILD</span><span class="s">per idea</span></div>
          <div class="node"><div class="n-name">PLAN</div><div class="n-sub">CTO &#183; OPUS</div></div>
          <div class="arr"><div class="arr-l"><div class="arr-d"></div><div class="arr-h"></div></div></div>
          <div class="node"><div class="n-name">BUILD</div><div class="n-sub">FE &#8594; BE &#8594; TEST</div></div>
          <div class="arr"><div class="arr-l"><div class="arr-d" style="animation-delay:.5s"></div><div class="arr-h"></div></div></div>
          <div class="node"><div class="n-name">DEPLOY</div><div class="n-sub">GITHUB + VERCEL</div></div>
          <div class="arr"><div class="arr-l"><div class="arr-d" style="animation-delay:1s"></div><div class="arr-h"></div></div></div>
          <div class="node ship"><div class="n-name g">QA &#10003;</div><div class="n-sub">LIVE-URL CHECK</div></div>
        </div>
      </div>
    </div>
  </foreignObject>
</svg>
