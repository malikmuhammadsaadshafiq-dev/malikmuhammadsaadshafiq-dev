<svg xmlns="http://www.w3.org/2000/svg" width="800" height="170" fill="none">
  <foreignObject width="100%" height="100%">
    <div xmlns="http://www.w3.org/1999/xhtml">
      <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        @keyframes rise {
          from { opacity: 0; transform: translateY(10px); }
          to   { opacity: 1; transform: translateY(0); }
        }
        @keyframes flowDot {
          0%   { left: 0%; opacity: 0; }
          12%  { opacity: 1; }
          88%  { opacity: 1; }
          100% { left: 100%; opacity: 0; }
        }
        @keyframes shipGlow {
          0%, 100% { box-shadow: 0 0 6px rgba(52,211,153,0.15); border-color: rgba(52,211,153,0.4); }
          50%      { box-shadow: 0 0 16px rgba(52,211,153,0.35); border-color: rgba(52,211,153,0.7); }
        }
        @keyframes breathe {
          0%, 100% { opacity: 0.4; }
          50%      { opacity: 1; }
        }
        .pipe-wrap {
          width: 800px;
          height: 170px;
          font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
          background: #0d1117;
          border: 1px solid rgba(48,54,61,0.6);
          border-radius: 12px;
          padding: 16px 18px;
          display: flex;
          flex-direction: column;
          justify-content: center;
          gap: 12px;
        }
        .loop-row { display: flex; align-items: center; }
        .loop-label {
          width: 82px;
          flex-shrink: 0;
          font-size: 9px;
          font-weight: 700;
          text-transform: uppercase;
          letter-spacing: 1.5px;
          text-align: right;
          padding-right: 12px;
          color: #8b949e;
        }
        .loop-time {
          font-size: 8px;
          font-weight: 500;
          opacity: 0.7;
          display: block;
          margin-top: 2px;
          color: #6e7681;
        }
        .stage {
          flex: 1;
          padding: 11px 8px;
          border: 1px solid rgba(48,54,61,0.6);
          border-radius: 10px;
          text-align: center;
          background: rgba(22,27,34,0.5);
          animation: rise 0.55s ease both;
        }
        .loop-1 .stage:nth-of-type(1) { animation-delay: 0.00s; }
        .loop-1 .stage:nth-of-type(2) { animation-delay: 0.10s; }
        .loop-1 .stage:nth-of-type(3) { animation-delay: 0.20s; }
        .loop-2 .stage:nth-of-type(1) { animation-delay: 0.25s; }
        .loop-2 .stage:nth-of-type(2) { animation-delay: 0.35s; }
        .loop-2 .stage:nth-of-type(3) { animation-delay: 0.45s; }
        .ship { animation: rise 0.55s ease 0.55s both, shipGlow 2.4s ease-in-out infinite; }
        .label { font-size: 12px; font-weight: 700; color: #c9d1d9; margin-bottom: 2px; }
        .label.v { color: #a78bfa; }
        .label.g { color: #34d399; }
        .sub { font-size: 9px; color: #6e7681; }
        .arrow {
          width: 30px;
          height: 28px;
          display: flex;
          align-items: center;
          flex-shrink: 0;
          position: relative;
          overflow: hidden;
        }
        .arrow-line { width: 100%; height: 1.5px; background: rgba(75,85,99,0.45); position: relative; }
        .arrow-dot {
          position: absolute;
          width: 5px; height: 5px;
          border-radius: 50%;
          top: -1.75px;
          background: #a78bfa;
          animation: flowDot 2s ease-in-out infinite;
        }
        .arrow-head {
          position: absolute;
          right: -1px;
          width: 0; height: 0;
          border-top: 4px solid transparent;
          border-bottom: 4px solid transparent;
          border-left: 5px solid rgba(75,85,99,0.45);
        }
        .divider {
          display: flex;
          align-items: center;
          gap: 10px;
          padding: 0 82px;
        }
        .divider-line { flex: 1; height: 1px; background: rgba(75,85,99,0.18); }
        .divider-text {
          font-size: 8px;
          color: #6e7681;
          font-weight: 600;
          letter-spacing: 0.8px;
          text-transform: uppercase;
          white-space: nowrap;
          animation: breathe 3.5s ease infinite;
        }
      </style>
      <div class="pipe-wrap">
        <div class="loop-row loop-1">
          <div class="loop-label">Research<span class="loop-time">continuous</span></div>
          <div class="stage"><div class="label v">Research</div><div class="sub">4 sources</div></div>
          <div class="arrow"><div class="arrow-line"><div class="arrow-dot"></div><div class="arrow-head"></div></div></div>
          <div class="stage"><div class="label v">Verify</div><div class="sub">multi-dim score</div></div>
          <div class="arrow"><div class="arrow-line"><div class="arrow-dot" style="animation-delay:0.6s"></div><div class="arrow-head"></div></div></div>
          <div class="stage"><div class="label v">Queue</div><div class="sub">approved ideas</div></div>
        </div>
        <div class="divider">
          <div class="divider-line"></div>
          <div class="divider-text">one product built end-to-end at a time</div>
          <div class="divider-line"></div>
        </div>
        <div class="loop-row loop-2">
          <div class="loop-label">Build<span class="loop-time">per idea</span></div>
          <div class="stage"><div class="label">Plan</div><div class="sub">CTO &#183; opus</div></div>
          <div class="arrow"><div class="arrow-line"><div class="arrow-dot"></div><div class="arrow-head"></div></div></div>
          <div class="stage"><div class="label">Build</div><div class="sub">FE &#8594; BE &#8594; Test</div></div>
          <div class="arrow"><div class="arrow-line"><div class="arrow-dot" style="animation-delay:0.5s"></div><div class="arrow-head"></div></div></div>
          <div class="stage"><div class="label">Deploy</div><div class="sub">GitHub + Vercel</div></div>
          <div class="arrow"><div class="arrow-line"><div class="arrow-dot" style="animation-delay:1s"></div><div class="arrow-head"></div></div></div>
          <div class="stage ship"><div class="label g">QA &#10003;</div><div class="sub">live-URL check</div></div>
        </div>
      </div>
    </div>
  </foreignObject>
</svg>
