<svg xmlns="http://www.w3.org/2000/svg" width="800" height="84" fill="none">
  <foreignObject width="100%" height="100%">
    <div xmlns="http://www.w3.org/1999/xhtml">
      <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        @keyframes blink { 0%,100% { opacity: 1; } 50% { opacity: 0.25; } }
        @keyframes wave { 0%,100% { height: 6px; } 50% { height: var(--h); } }
        @keyframes rise { from { opacity: 0; transform: translateX(-12px); } to { opacity: 1; transform: translateX(0); } }
        .panel {
          position: relative; width: 800px; height: 84px;
          background: linear-gradient(180deg, #0e141d, #0b1017);
          border: 1px solid rgba(64,200,200,0.16); border-radius: 10px; overflow: hidden;
          display: flex; align-items: center; gap: 20px; padding: 0 22px;
          font-family: ui-monospace, 'Cascadia Mono', 'JetBrains Mono', 'SF Mono', Consolas, monospace;
        }
        .corner { position: absolute; width: 10px; height: 10px; border: 1.5px solid rgba(63,224,208,0.5); }
        .c-tl { top: 6px; left: 6px; border-right: 0; border-bottom: 0; } .c-tr { top: 6px; right: 6px; border-left: 0; border-bottom: 0; }
        .c-bl { bottom: 6px; left: 6px; border-right: 0; border-top: 0; } .c-br { bottom: 6px; right: 6px; border-left: 0; border-top: 0; }
        .status { display: flex; align-items: center; gap: 11px; flex-shrink: 0; animation: rise 0.6s ease; }
        .ring { width: 30px; height: 30px; border-radius: 50%; border: 1.5px solid rgba(63,224,208,0.4); display: flex; align-items: center; justify-content: center; }
        .ring i { width: 9px; height: 9px; border-radius: 50%; background: #3fe0d0; box-shadow: 0 0 9px rgba(63,224,208,0.8); animation: blink 1.4s ease infinite; }
        .txt .a { font-size: 12px; font-weight: 700; letter-spacing: 1px; color: #cfe0ea; }
        .txt .a span { color: #3fe0d0; }
        .txt .b { font-size: 8.5px; letter-spacing: 1.5px; color: #56697a; margin-top: 2px; }
        .sep { width: 1px; height: 36px; background: rgba(64,200,200,0.14); flex-shrink: 0; }
        .wave { display: flex; align-items: center; gap: 3px; height: 34px; flex: 1; min-width: 0; overflow: hidden; }
        .wave b { width: 4px; border-radius: 1px; background: #3fe0d0; opacity: 0.75; animation: wave 1.3s ease-in-out infinite; }
        .metrics { display: flex; gap: 18px; flex-shrink: 0; }
        .m { text-align: right; animation: rise 0.6s ease both; }
        .m .n { font-size: 16px; font-weight: 800; line-height: 1; color: #eaf3f7; }
        .m .n.cy { color: #3fe0d0; } .m .n.am { color: #ffb02e; }
        .m .l { font-size: 7.5px; letter-spacing: 1.5px; color: #56697a; margin-top: 3px; }
      </style>
      <div class="panel">
        <span class="corner c-tl"></span><span class="corner c-tr"></span><span class="corner c-bl"></span><span class="corner c-br"></span>
        <div class="status">
          <div class="ring"><i></i></div>
          <div class="txt"><div class="a">PIPELINE <span>ACTIVE</span></div><div class="b">RESEARCHING + BUILDING 24/7</div></div>
        </div>
        <div class="sep"></div>
        <div class="wave">
          <b style="--h:30px;animation-delay:0s"></b><b style="--h:18px;animation-delay:.1s"></b><b style="--h:26px;animation-delay:.2s"></b>
          <b style="--h:14px;animation-delay:.3s"></b><b style="--h:32px;animation-delay:.4s"></b><b style="--h:20px;animation-delay:.5s"></b>
          <b style="--h:28px;animation-delay:.6s"></b><b style="--h:16px;animation-delay:.7s"></b><b style="--h:30px;animation-delay:.15s"></b>
          <b style="--h:22px;animation-delay:.25s"></b><b style="--h:12px;animation-delay:.35s"></b><b style="--h:26px;animation-delay:.45s"></b>
          <b style="--h:34px;animation-delay:.55s"></b><b style="--h:18px;animation-delay:.65s"></b><b style="--h:24px;animation-delay:.05s"></b>
          <b style="--h:30px;animation-delay:.5s"></b><b style="--h:16px;animation-delay:.2s"></b><b style="--h:28px;animation-delay:.6s"></b>
        </div>
        <div class="sep"></div>
        <div class="metrics">
          <div class="m"><div class="n cy">24/7</div><div class="l">UPTIME</div></div>
          <div class="m"><div class="n am">~48</div><div class="l">CYCLES/DAY</div></div>
          <div class="m"><div class="n">450+</div><div class="l">SHIPPED</div></div>
        </div>
      </div>
    </div>
  </foreignObject>
</svg>
