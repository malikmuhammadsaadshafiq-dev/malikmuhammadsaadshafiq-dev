<svg xmlns="http://www.w3.org/2000/svg" width="800" height="178" fill="none">
  <foreignObject width="100%" height="100%">
    <div xmlns="http://www.w3.org/1999/xhtml">
      <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        @keyframes blink { 0%,100% { opacity: 1; } 50% { opacity: 0.25; } }
        @keyframes scan { 0% { top: -2px; opacity: 0; } 8% { opacity: 1; } 92% { opacity: 1; } 100% { top: 178px; opacity: 0; } }
        @keyframes caret { 0%,49% { opacity: 1; } 50%,100% { opacity: 0; } }
        @keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
        .hud {
          position: relative; width: 800px; height: 178px;
          background: radial-gradient(130% 150% at 10% -10%, #0d1b25 0%, #0a0f15 58%);
          border: 1px solid rgba(64,200,200,0.18); border-radius: 10px; overflow: hidden;
          font-family: ui-monospace, 'Cascadia Mono', 'JetBrains Mono', 'SF Mono', Consolas, 'Liberation Mono', monospace;
          padding: 15px 20px;
        }
        .grid { position: absolute; inset: 0; pointer-events: none;
          background-image: linear-gradient(rgba(64,200,200,0.05) 1px, transparent 1px), linear-gradient(90deg, rgba(64,200,200,0.05) 1px, transparent 1px);
          background-size: 28px 28px; }
        .scanline { position: absolute; left: 0; width: 100%; height: 2px; pointer-events: none;
          background: linear-gradient(90deg, transparent, rgba(63,224,208,0.5), transparent); animation: scan 5.5s linear infinite; }
        .corner { position: absolute; width: 13px; height: 13px; border: 1.5px solid rgba(63,224,208,0.6); }
        .c-tl { top: 7px; left: 7px; border-right: 0; border-bottom: 0; }
        .c-tr { top: 7px; right: 7px; border-left: 0; border-bottom: 0; }
        .c-bl { bottom: 7px; left: 7px; border-right: 0; border-top: 0; }
        .c-br { bottom: 7px; right: 7px; border-left: 0; border-top: 0; }
        .topbar { display: flex; justify-content: space-between; align-items: center; position: relative; }
        .eyebrow { font-size: 9.5px; font-weight: 700; letter-spacing: 3px; color: #5f8294; }
        .eyebrow b { color: #3fe0d0; }
        .clock { font-size: 9.5px; letter-spacing: 2px; color: #5f8294; display: flex; align-items: center; gap: 7px; }
        .led { width: 7px; height: 7px; border-radius: 50%; background: #36e08a; box-shadow: 0 0 8px rgba(54,224,138,0.7); animation: blink 1.8s ease infinite; }
        .mid { display: flex; justify-content: space-between; align-items: flex-end; margin-top: 14px; position: relative; }
        .title { font-size: 40px; font-weight: 800; letter-spacing: 2px; color: #eaf6f4; line-height: 1; animation: rise 0.6s ease both; }
        .title .caret { color: #3fe0d0; animation: caret 1.1s step-end infinite; }
        .subtitle { font-size: 10px; letter-spacing: 3.5px; color: #6a8093; margin-top: 9px; animation: rise 0.6s ease 0.1s both; }
        .readout { text-align: right; animation: rise 0.6s ease 0.15s both; }
        .ro-line { font-size: 10px; letter-spacing: 1.5px; color: #8aa0b0; margin-bottom: 4px; }
        .ro-line .ok { color: #36e08a; }
        .ro-line .v { color: #cfe0ea; }
        .ro-spark { font-size: 12px; letter-spacing: 1px; color: #ffb02e; }
        .subsys { display: flex; gap: 7px; margin-top: 14px; position: relative; }
        .chip { flex: 1; display: flex; align-items: center; justify-content: center; gap: 6px;
          font-size: 8.5px; font-weight: 600; letter-spacing: 1.5px; color: #8aa0b0;
          padding: 5px 0; border: 1px solid rgba(64,200,200,0.14); border-radius: 5px; background: rgba(63,224,208,0.04); animation: rise 0.5s ease both; }
        .chip:nth-child(1){animation-delay:.20s} .chip:nth-child(2){animation-delay:.26s} .chip:nth-child(3){animation-delay:.32s}
        .chip:nth-child(4){animation-delay:.38s} .chip:nth-child(5){animation-delay:.44s} .chip:nth-child(6){animation-delay:.50s}
        .dot { width: 5px; height: 5px; border-radius: 50%; background: #3fe0d0; box-shadow: 0 0 6px rgba(63,224,208,0.7); animation: blink 2.2s ease infinite; }
        .chip:nth-child(2) .dot{animation-delay:.3s} .chip:nth-child(3) .dot{animation-delay:.6s}
        .chip:nth-child(4) .dot{animation-delay:.9s} .chip:nth-child(5) .dot{animation-delay:1.2s} .chip:nth-child(6) .dot{animation-delay:1.5s}
      </style>
      <div class="hud">
        <div class="grid"></div>
        <div class="scanline"></div>
        <span class="corner c-tl"></span><span class="corner c-tr"></span><span class="corner c-bl"></span><span class="corner c-br"></span>
        <div class="topbar">
          <div class="eyebrow">SYS.00 <b>//</b> MISSION CONTROL &#183; OPERATOR: SAAD SHAFIQ</div>
          <div class="clock"><span class="led"></span>ONLINE &#183; T+ 24/7</div>
        </div>
        <div class="mid">
          <div>
            <div class="title">MVP FACTORY<span class="caret">_</span></div>
            <div class="subtitle">AUTONOMOUS SOFTWARE PRODUCTION LINE</div>
          </div>
          <div class="readout">
            <div class="ro-line"><span class="ok">&#9679;</span> ALL SYSTEMS NOMINAL</div>
            <div class="ro-line"><span class="v">8</span> AGENTS &#183; <span class="v">450+</span> SHIPPED</div>
            <div class="ro-spark">&#9601;&#9602;&#9603;&#9605;&#9607;&#9606;&#9604;&#9602;&#9601;&#9603;&#9605;&#9607;</div>
          </div>
        </div>
        <div class="subsys">
          <div class="chip"><span class="dot"></span>RESEARCH</div>
          <div class="chip"><span class="dot"></span>VERIFY</div>
          <div class="chip"><span class="dot"></span>CTO</div>
          <div class="chip"><span class="dot"></span>BUILD</div>
          <div class="chip"><span class="dot"></span>DEPLOY</div>
          <div class="chip"><span class="dot"></span>QA</div>
        </div>
      </div>
    </div>
  </foreignObject>
</svg>
