<svg xmlns="http://www.w3.org/2000/svg" width="800" height="300" fill="none">
  <foreignObject width="100%" height="100%">
    <div xmlns="http://www.w3.org/1999/xhtml">
      <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        @keyframes rise {
          from { opacity: 0; transform: translateY(8px); }
          to   { opacity: 1; transform: translateY(0); }
        }
        @keyframes breathe {
          0%, 100% { opacity: 0.35; }
          50%      { opacity: 1; }
        }
        .scene {
          width: 800px;
          height: 300px;
          background: #0d1117;
          border: 1px solid rgba(48,54,61,0.6);
          border-radius: 12px;
          padding: 20px 22px;
          font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
          display: flex;
          flex-direction: column;
        }
        .head {
          display: flex;
          align-items: center;
          justify-content: space-between;
          margin-bottom: 16px;
        }
        .head .title {
          font-size: 11px;
          font-weight: 600;
          letter-spacing: 3px;
          text-transform: uppercase;
          color: #8b949e;
        }
        .head .live {
          display: flex;
          align-items: center;
          gap: 6px;
          font-size: 9px;
          font-weight: 600;
          letter-spacing: 1.5px;
          text-transform: uppercase;
          color: #6e7681;
        }
        .head .dot {
          width: 6px; height: 6px; border-radius: 50%;
          background: #34d399;
          animation: breathe 2.4s ease-in-out infinite;
        }
        .grid {
          flex: 1;
          display: grid;
          grid-template-columns: repeat(4, 1fr);
          grid-template-rows: repeat(2, 1fr);
          gap: 12px;
        }
        .agent {
          background: rgba(22,27,34,0.5);
          border: 1px solid rgba(48,54,61,0.55);
          border-radius: 10px;
          padding: 10px 12px;
          display: flex;
          flex-direction: column;
          justify-content: space-between;
          animation: rise 0.5s ease both;
        }
        .agent:nth-child(1) { animation-delay: 0.00s; }
        .agent:nth-child(2) { animation-delay: 0.06s; }
        .agent:nth-child(3) { animation-delay: 0.12s; }
        .agent:nth-child(4) { animation-delay: 0.18s; }
        .agent:nth-child(5) { animation-delay: 0.24s; }
        .agent:nth-child(6) { animation-delay: 0.30s; }
        .agent:nth-child(7) { animation-delay: 0.36s; }
        .agent:nth-child(8) { animation-delay: 0.42s; }
        .row-top {
          display: flex;
          align-items: center;
          justify-content: space-between;
        }
        .ord {
          font-size: 9px;
          font-weight: 700;
          letter-spacing: 1px;
          color: #484f58;
          font-family: 'SF Mono', 'JetBrains Mono', monospace;
        }
        .tier {
          font-size: 8px;
          font-weight: 700;
          letter-spacing: 0.5px;
          text-transform: lowercase;
          padding: 2px 6px;
          border-radius: 5px;
          border: 1px solid;
        }
        .t-haiku { color: #34d399; border-color: rgba(52,211,153,0.3); background: rgba(52,211,153,0.08); }
        .t-sonnet { color: #a78bfa; border-color: rgba(167,139,250,0.3); background: rgba(167,139,250,0.08); }
        .t-opus { color: #fbbf24; border-color: rgba(251,191,36,0.3); background: rgba(251,191,36,0.08); }
        .t-det { color: #8b949e; border-color: rgba(139,148,158,0.3); background: rgba(139,148,158,0.06); }
        .row-body {
          display: flex;
          align-items: center;
          gap: 9px;
        }
        .ic {
          width: 30px; height: 30px;
          flex-shrink: 0;
          border-radius: 8px;
          background: rgba(139,92,246,0.10);
          border: 1px solid rgba(139,92,246,0.18);
          display: flex;
          align-items: center;
          justify-content: center;
          font-size: 15px;
        }
        .meta { overflow: hidden; }
        .nm {
          font-size: 12px;
          font-weight: 700;
          color: #e6edf3;
          white-space: nowrap;
        }
        .rl {
          font-size: 9px;
          color: #6e7681;
          margin-top: 1px;
          white-space: nowrap;
        }
      </style>
      <div class="scene">
        <div class="head">
          <div class="title">AI Squadron &#183; 8 Agents</div>
          <div class="live"><span class="dot"></span>running on Claude Code</div>
        </div>
        <div class="grid">
          <div class="agent">
            <div class="row-top"><span class="ord">01</span><span class="tier t-haiku">haiku</span></div>
            <div class="row-body"><div class="ic">&#128269;</div><div class="meta"><div class="nm">Researcher</div><div class="rl">Idea Scout</div></div></div>
          </div>
          <div class="agent">
            <div class="row-top"><span class="ord">02</span><span class="tier t-haiku">haiku</span></div>
            <div class="row-body"><div class="ic">&#9989;</div><div class="meta"><div class="nm">Verifier</div><div class="rl">Idea Validator</div></div></div>
          </div>
          <div class="agent">
            <div class="row-top"><span class="ord">03</span><span class="tier t-opus">opus</span></div>
            <div class="row-body"><div class="ic">&#128421;</div><div class="meta"><div class="nm">CTO</div><div class="rl">Tech Strategist</div></div></div>
          </div>
          <div class="agent">
            <div class="row-top"><span class="ord">04</span><span class="tier t-sonnet">sonnet</span></div>
            <div class="row-body"><div class="ic">&#127912;</div><div class="meta"><div class="nm">Frontend Dev</div><div class="rl">UI/UX Engineer</div></div></div>
          </div>
          <div class="agent">
            <div class="row-top"><span class="ord">05</span><span class="tier t-sonnet">sonnet</span></div>
            <div class="row-body"><div class="ic">&#9881;</div><div class="meta"><div class="nm">Backend Dev</div><div class="rl">API Engineer</div></div></div>
          </div>
          <div class="agent">
            <div class="row-top"><span class="ord">06</span><span class="tier t-haiku">haiku</span></div>
            <div class="row-body"><div class="ic">&#129514;</div><div class="meta"><div class="nm">Tester</div><div class="rl">QA Engineer</div></div></div>
          </div>
          <div class="agent">
            <div class="row-top"><span class="ord">07</span><span class="tier t-det">deterministic</span></div>
            <div class="row-body"><div class="ic">&#128640;</div><div class="meta"><div class="nm">Deployer</div><div class="rl">DevOps Engineer</div></div></div>
          </div>
          <div class="agent">
            <div class="row-top"><span class="ord">08</span><span class="tier t-sonnet">sonnet</span></div>
            <div class="row-body"><div class="ic">&#128300;</div><div class="meta"><div class="nm">QA</div><div class="rl">Browser Tester</div></div></div>
          </div>
        </div>
      </div>
    </div>
  </foreignObject>
</svg>
